<style>
@font-face{font-family:CZ;src:url(fichiers/app/fonts/cinzel-latin-700-normal.woff2);font-weight:700}

html,body{margin:0;min-height:100%;background:var(--nuit);color:var(--texte);font:14.5px/1.55 DM,system-ui,sans-serif}
.fond{position:fixed;inset:-3%;background:url(fichiers/app/img/fond_accueil_vouivre.jpg) center/cover;animation:lent 30s ease-in-out infinite alternate}

.voile{position:fixed;inset:0;background:linear-gradient(90deg,rgba(8,11,16,.92) 0%,rgba(8,11,16,.7) 55%,rgba(8,11,16,.3) 100%)}
.page{position:relative;max-width:820px;padding:5vh 6vw 40px}
.tete{display:flex;align-items:center;gap:14px}
.tete img{width:48px;height:48px}
.tete .n{font:700 24px CZ,serif;color:var(--or);letter-spacing:2px;text-shadow:0 1px 0 #7a5418,0 0 18px rgba(226,184,92,.35)}
.tete small{display:block;font:600 italic 16px CG,serif;color:var(--doux)}
.tete select{margin-left:auto;background:rgba(10,12,16,.8);border:1px solid rgba(201,154,62,.45);color:var(--doux);border-radius:3px;padding:4px 6px;font:inherit}
h1{font:700 32px/1.15 CG,serif;color:#fbf1d6;margin:26px 0 4px}
.sous{color:var(--gris);margin:0 0 18px}
.tuiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tuile{position:relative;border:1px solid rgba(201,154,62,.35);border-radius:6px;background:rgba(16,20,28,.78);padding:14px 12px 12px;cursor:pointer;text-align:center;transition:border-color .2s,transform .15s,background .2s;user-select:none;color:inherit;font:inherit}
.tuile:hover{border-color:rgba(244,217,142,.8);transform:translateY(-2px)}
.tuile.sel{border-color:var(--or);background:linear-gradient(180deg,rgba(201,154,62,.3),rgba(201,154,62,.06));box-shadow:0 0 20px rgba(226,184,92,.28)}
.tuile svg{width:34px;height:34px;stroke:var(--or);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tuile b{display:block;font-weight:600;margin-top:6px;color:#fbf1d6}
.tuile .vous{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#f4d98e,#c99a3e);color:#1a1206;font:700 9.5px DM;letter-spacing:1px;text-transform:uppercase;border-radius:9px;padding:2px 8px;white-space:nowrap}
.detail{margin-top:18px;background:rgba(12,16,23,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(201,154,62,.6);outline:1px solid rgba(201,154,62,.2);outline-offset:4px;border-radius:6px;padding:20px 24px;animation:entre .4s ease both}
@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.detail h2{font:700 24px CG,serif;color:var(--or);margin:0 0 12px}
.detail ol{margin:0;padding:0;list-style:none;counter-reset:e}
.detail li{counter-increment:e;position:relative;padding:0 0 12px 40px;color:var(--texte)}
.detail li::before{content:counter(e);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;border:1px solid var(--or2);color:var(--or);font:700 13px CZ,serif;display:flex;align-items:center;justify-content:center}
.detail em{font-style:normal;color:#f4d98e;font-weight:600}
.cmd{display:flex;gap:8px;align-items:center;margin-top:6px;background:rgba(8,10,14,.9);border:1px solid rgba(201,154,62,.45);border-radius:4px;padding:8px 10px;font:13px Consolas,'DejaVu Sans Mono',monospace;color:#f4d98e;word-break:break-all}
.cmd button{margin-left:auto;flex-shrink:0;background:transparent;border:1px solid rgba(201,154,62,.45);color:var(--doux);border-radius:3px;padding:3px 10px;cursor:pointer;font:12px DM}
.note{font-size:12.5px;color:var(--gris);border-left:2px solid rgba(201,154,62,.4);padding-left:10px;margin:6px 0 0}
.bouton{display:inline-block;background:linear-gradient(180deg,#f4d98e,#c99a3e);color:#1a1206;font:700 13px CZ,serif;letter-spacing:1px;border:0;border-radius:3px;padding:11px 22px;box-shadow:0 0 18px rgba(226,184,92,.35);cursor:pointer;text-decoration:none;margin-top:4px}
.pied{margin-top:22px;font-size:12px;color:#8f8672}
@media (max-width:640px){.page{padding:24px 16px}.tuiles{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}.voile{background:rgba(8,11,16,.78)}}
@media (prefers-reduced-motion:reduce){.fond,.detail{animation:none}}
</style>

  function detecter() {

    }).join("");
    var etapes = t[choix].map(function (e, i) {
      var cmd = (choix === "linux" || choix === "rpi") && i === 1 ? '<div class="cmd"><span>' + CMD.replace(/"/g, "&quot;") + '</span><button id="copier">' + t.copier + "</button></div>" : "";
      return "<li>" + e + cmd + "</li>";
    }).join("");
    $("detail").innerHTML = "<h2>" + t.noms[choix] + "</h2><ol>" + etapes + "</ol>" +
