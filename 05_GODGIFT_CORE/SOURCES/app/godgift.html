<!doctype html>
<!-- GodGift Core installe (file://) : la page que les installateurs ouvrent. index.html (la version web, app.angedeleau.com) en est tiree par
     construire.py : memes scripts, chacun avec son empreinte SRI, une CSP limitee aux origines exactes, sans gg_empreinte.js ni gg_fenetre.js.
     gg_empreinte.js et gg_fenetre.js sont ecrits par l'installateur (hors de SHA256SUMS) : l'empreinte du programme verifiee, et l'empreinte
     du jeton de la fenetre dediee (le jeton lui-meme n'est que dans le raccourci du lanceur). -->
<html lang="fr" translate="yes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: wss: http: ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="google" content="notranslate">
<title>GodGift Core</title>
<link rel="icon" href="img/icone.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1220">
<link rel="apple-touch-icon" href="img/icone_192.png">
<link rel="stylesheet" href="gg.css">
</head>
<body>
<div id="app" class="app">
  <aside class="cote">
    <div class="logo">GodGift Core<small id="sous-logo">le nœud de la chasse</small></div>
    <nav id="menu"></nav>
    <div class="etat" id="etat-cote"></div>
  </aside>
  <main class="main">
    <div class="fond" id="fond"></div><div class="voile"></div>
    <div class="statut" id="statut"></div>
    <div class="dedans" id="page"></div>
  </main>
</div>
<div id="accueil" class="accueil" hidden></div>
<script src="gg_crypto.js"></script>
<script src="gg_regles.js"></script>
<script src="gg_i18n.js"></script>
<script src="gg_i18n_mp.js"></script>
<script src="gg_i18n_beta.js"></script>
<script src="gg_tlock.js"></script>
<script src="gg_tx.js"></script>
<script src="gg_liste.js"></script>
<script src="gg_pierre.js"></script>
<script src="gg_cg.js"></script>
<script src="gg_demo.js"></script>
<script src="gg_ancre.js"></script>
<script src="gg_guide.js"></script>
<script src="gg_empreinte.js"></script>
<script src="gg_fenetre.js"></script>
<script src="gg_app.js"></script>
</body>
</html>
